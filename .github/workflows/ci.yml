name: CI

on:
  push:
    branches: [main, phase-0-ci-baseline]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit (high severity and above)
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install locked desktop packaging dependencies
        working-directory: desktop
        run: npm ci --no-fund
      - name: Audit locked desktop packaging dependencies
        working-directory: desktop
        run: npm audit --audit-level=high

  supabase-migration-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL test driver
        run: npm install --no-save --package-lock=false pg
      - name: Replay every migration and test firm isolation
        run: node --test tests/supabase-migration-isolation.integration.test.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgerly_test
