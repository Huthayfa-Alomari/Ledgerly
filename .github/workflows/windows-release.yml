name: Ledgerly Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/six-service-platform-foundation', 'fix/security-audit-review-oct-2026']
    tags:
      - "ledgerly-v*"

# Default permissions are read-only. GitHub permissions are scoped to jobs, not individual steps.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install and verify web application
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Install locked desktop packaging dependencies
        working-directory: desktop
        run: npm ci --no-fund
      - name: Audit desktop packaging dependencies
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        run: |
          if ($env:WIN_CSC_LINK -and $env:WIN_CSC_KEY_PASSWORD) {
            Write-Host "Code-signing credentials found; requiring a signed installer."
            npm run dist -- --config.forceCodeSigning=true
          } else {
            Write-Warning "No Windows code-signing certificate configured. This unsigned development build may be blocked by browser or operating-system reputation checks."
            npm run dist
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify installer signature and write SHA-256 manifest
        working-directory: desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release/*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced." }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($env:WIN_CSC_LINK -and $signature.Status -ne "Valid") {
            throw "A signing certificate was configured, but the installer signature status is $($signature.Status)."
          }
          if ($signature.Status -eq "Valid") {
            Write-Host "Valid Authenticode signature: $($signature.SignerCertificate.Subject)"
          } else {
            Write-Warning "Installer is unsigned. SHA-256 verifies file integrity only; it does not establish safety or publisher identity."
          }
          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA-256: $($hash.Hash)"
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ledgerly-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/ledgerly-v')
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write permission exists only in the isolated release-publishing job.
    permissions:
      contents: write
    steps:
      - name: Download verified installer artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Ledgerly-Windows-Installer
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Ledgerly ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
